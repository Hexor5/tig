<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Shubham (hexorhexor66@gmail.com)">
<title>Tiger Zone Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Noto+Sans:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Soft UI (neumorphism): one surface colour, raised cards and pressed-in inputs. One column: enter, result, time table, map. */
:root{
  --bg:#E3E8E2; --sd:#BCC4BA; --sl:#FFFFFF; --ink:#1E2B23; --muted:#5A6B5F;
  --accent:#B85E0F; --accent-ink:#FFFFFF; --inner:#C88A0C; --outer:#C23B27; --ok:#2C7647;
  --map-bg:#D7DED4; --map-grid:#B9C4B5; --map-ink:#46594B;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Noto Sans","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --raise:7px 7px 16px var(--sd),-7px -7px 16px var(--sl);
  --raise-sm:4px 4px 9px var(--sd),-4px -4px 9px var(--sl);
  --press:inset 4px 4px 9px var(--sd),inset -4px -4px 9px var(--sl);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#232B26; --sd:#171D19; --sl:#2F3A33; --ink:#E4EBE5; --muted:#9AAB9F;
  --accent:#F0953A; --accent-ink:#1E1205; --inner:#F2C14E; --outer:#F06A55; --ok:#5CC98A;
  --map-bg:#1C241F; --map-grid:#2C3830; --map-ink:#A3B4A7; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#232B26; --sd:#171D19; --sl:#2F3A33; --ink:#E4EBE5; --muted:#9AAB9F;
  --accent:#F0953A; --accent-ink:#1E1205; --inner:#F2C14E; --outer:#F06A55; --ok:#5CC98A;
  --map-bg:#1C241F; --map-grid:#2C3830; --map-ink:#A3B4A7; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
.app{max-width:780px;margin:0 auto;padding-inline:18px;padding-block:20px 48px;display:flex;flex-direction:column;gap:26px}
h1,h2{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:2.1rem;line-height:1.05}
h2{font-size:1.4rem;display:flex;align-items:center;gap:10px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top .tt{flex:1;min-width:0}
.lang{flex:none;align-self:flex-start}
.lang button{font-size:.9rem;padding:8px 12px}
.top{position:relative}
td .d-m{display:none}
@media (max-width:560px){.top{padding-top:58px}.top .lang{position:absolute;top:0;right:0}}
.mark{width:52px;height:52px;flex:none;border-radius:50%;box-shadow:var(--raise);display:grid;place-items:center}
.mark span{width:30px;height:30px;border-radius:50%;background:repeating-linear-gradient(115deg,var(--accent) 0 6px,var(--ink) 6px 10px)}
.sub{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.card{background:var(--bg);border-radius:24px;padding:22px;box-shadow:var(--raise)}
.step{flex:none;display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;box-shadow:var(--press);font-family:var(--font-display);font-weight:600;font-size:1.05rem;color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label,.lbl{font-size:.85rem;color:var(--muted);font-weight:500;padding-left:4px}
input[type=text],input[type=number],input[type=datetime-local],input[type=password]{background:var(--bg);border:0;border-radius:14px;padding:14px;min-width:0;width:100%;font-size:1.1rem;box-shadow:var(--press)}
input.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.err{font-size:.8rem;color:var(--outer);padding-left:4px}
.when{margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.chip{border:0;background:var(--bg);border-radius:999px;padding:9px 16px;font-size:.95rem;box-shadow:var(--raise-sm);transition:box-shadow .15s}
.chip[aria-pressed=true]{box-shadow:var(--press);color:var(--accent);font-weight:700}
#customWhen{margin-top:10px}
.go{margin-top:20px;width:100%;border:0;border-radius:18px;padding:17px;background:var(--accent);color:var(--accent-ink);font-family:var(--font-display);font-weight:600;font-size:1.45rem;letter-spacing:.02em;box-shadow:var(--raise)}
.go:active{box-shadow:var(--press);filter:brightness(.95)}
.tip{margin:12px 0 0;font-size:.82rem;color:var(--muted);padding-left:4px}
.samplenote{margin-top:14px;font-size:.82rem;color:var(--accent);border-radius:14px;padding:10px 14px;box-shadow:var(--press)}
.result{text-align:center}
.result .eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.dial{margin:16px auto 6px;width:min(240px,70vw);aspect-ratio:1;border-radius:50%;box-shadow:var(--raise);display:grid;place-items:center;position:relative}
.dial::before{content:"";position:absolute;inset:16px;border-radius:50%;box-shadow:var(--press)}
.dial div{position:relative;display:flex;flex-direction:column;align-items:center;line-height:1}
.dial .n{font-family:var(--font-display);font-weight:600;font-size:clamp(3.2rem,15vw,4.4rem);color:var(--inner);font-variant-numeric:tabular-nums}
.dial .u{font-family:var(--font-display);font-size:1.3rem;color:var(--muted);margin-top:2px}
.headline{font-family:var(--font-display);font-weight:600;font-size:clamp(1.5rem,6vw,2rem);line-height:1.15;margin:10px 0 4px;text-wrap:balance}
.headline .out{color:var(--outer)}
.result p{margin:4px auto 0;font-size:.95rem;color:var(--muted);max-width:52ch}
.tablewrap{overflow-x:auto;margin-top:14px;border-radius:18px;box-shadow:var(--press);padding:6px}
table{border-collapse:separate;border-spacing:0 6px;width:100%;min-width:480px;font-variant-numeric:tabular-nums}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;text-align:left;padding:6px 12px}
td{padding:11px 12px;font-size:.98rem}
th.r,td.r{text-align:right}
tbody tr{cursor:pointer}
tbody tr td:first-child{border-radius:12px 0 0 12px}
tbody tr td:last-child{border-radius:0 12px 12px 0}
tbody tr:hover td{background:color-mix(in srgb,var(--sl) 45%,transparent)}
tbody tr.sel td{background:var(--bg);box-shadow:0 0 0 2px var(--accent) inset}
tbody tr.sel td:not(:first-child){box-shadow:0 2px 0 0 var(--accent) inset,0 -2px 0 0 var(--accent) inset}
tbody tr.sel td:first-child{box-shadow:2px 0 0 0 var(--accent) inset,0 2px 0 0 var(--accent) inset,0 -2px 0 0 var(--accent) inset}
tbody tr.sel td:last-child{box-shadow:-2px 0 0 0 var(--accent) inset,0 2px 0 0 var(--accent) inset,0 -2px 0 0 var(--accent) inset}
td .when-t{font-weight:700;font-family:var(--font-display);font-size:1.15rem}
td small{display:block;color:var(--muted);font-size:.78rem}
td .km-in{color:var(--inner);font-weight:700}
td .km-out{color:var(--outer);font-weight:700}
.view{font-size:.8rem;color:var(--accent);font-weight:700;white-space:nowrap}
.mapcard{padding:14px}
.mapwrap{position:relative;height:min(64vh,560px);min-height:360px;background:var(--map-bg);border-radius:18px;overflow:hidden;box-shadow:var(--press)}
#map{position:absolute;inset:0;width:100%;height:100%}
#map{display:block;touch-action:none;cursor:grab}
#fly{position:absolute;inset:0;width:100%;height:100%;z-index:5}
#skipFly{position:absolute;right:12px;bottom:12px;z-index:6;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.35);color:#fff;border-radius:10px;padding:6px 12px;font-size:.85rem}
.mtop{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:3}
.mtop>*{pointer-events:auto}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--bg);box-shadow:var(--raise-sm)}
.seg button{border:0;background:transparent;padding:7px 11px;border-radius:10px;font-size:.88rem}
.seg button[aria-pressed=true]{box-shadow:var(--press);color:var(--accent);font-weight:700}
.zoom{display:flex;flex-direction:column;gap:4px;padding:4px;border-radius:14px;background:var(--bg);box-shadow:var(--raise-sm)}
.zoom button{border:0;background:transparent;width:38px;height:38px;border-radius:10px;font-size:1.2rem}
.zoom button:active{box-shadow:var(--press)}
.maptag{position:absolute;left:50%;top:62px;transform:translateX(-50%);z-index:3;background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 14px;font-size:.85rem;font-weight:700;box-shadow:var(--raise-sm);white-space:nowrap}
.legend{position:absolute;left:10px;bottom:26px;z-index:3;background:var(--bg);border-radius:12px;padding:8px 11px;font-size:.78rem;display:grid;grid-template-columns:auto auto;gap:4px 8px;align-items:center;box-shadow:var(--raise-sm)}
.sw{width:16px;height:12px;border-radius:3px;display:inline-block}
.attr{position:absolute;right:6px;bottom:4px;max-width:calc(100% - 12px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.66rem;color:var(--map-ink);background:var(--bg);padding:0 5px;border-radius:4px;opacity:.85;z-index:2}
.mapnote{position:absolute;left:50%;top:100px;transform:translateX(-50%);width:min(92%,440px);background:var(--bg);border-radius:14px;padding:10px 12px;font-size:.82rem;color:var(--muted);display:flex;gap:8px;align-items:flex-start;z-index:4;box-shadow:var(--raise-sm)}
.mapnote button{border:0;background:transparent;color:var(--muted);font-size:1.1rem;line-height:1}
.info{position:absolute;z-index:4;max-width:240px;background:var(--bg);border-radius:12px;padding:9px 11px;font-size:.82rem;box-shadow:var(--raise-sm);pointer-events:none}
.mapbar{display:flex;flex-wrap:wrap;gap:12px;padding:16px 4px 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;background:var(--bg);border-radius:14px;padding:11px 15px;font-size:.93rem;text-decoration:none;color:var(--ink);box-shadow:var(--raise-sm)}
.btn:active{box-shadow:var(--press)}
.btn.hl{color:var(--accent);font-weight:700}
.btn[aria-pressed=true]{box-shadow:var(--press);color:var(--ok);font-weight:700}
.btn.danger{color:var(--outer)}
details.card>summary{font-family:var(--font-display);font-weight:600;font-size:1.3rem;cursor:pointer;list-style-position:inside}
details.card[open]>summary{margin-bottom:14px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hist li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;border-radius:14px;padding:9px 12px;box-shadow:var(--press)}
.num{width:28px;height:28px;border-radius:50%;box-shadow:var(--raise-sm);display:grid;place-items:center;font-size:.75rem;font-weight:700}
.hist li.last .num{background:var(--outer);color:#fff;box-shadow:none}
.hist small{color:var(--muted);display:block}
.mono{font-family:var(--font-mono);font-size:.85em;font-variant-numeric:tabular-nums}
.x{border:0;background:transparent;color:var(--muted);font-size:.85rem;padding:4px}
.x[data-armed]{color:var(--outer);font-weight:700}
.note{font-size:.85rem;color:var(--muted);margin:12px 0 0}
.status{font-size:.85rem;margin-top:8px;padding-left:4px}
.status.good{color:var(--ok)} .status.bad{color:var(--outer)}
.foot{font-size:.82rem;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:20}
.credit{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 14px;margin:16px 4px 4px;padding:12px 14px;border-radius:14px;box-shadow:var(--press);font-size:.88rem;color:var(--muted);text-align:center}
.credit [data-i=credit]{color:var(--ink);font-weight:700}
.credit b{color:var(--accent);font-family:var(--font-mono);font-weight:500;user-select:all;overflow-wrap:anywhere}
.btn.sm{padding:6px 12px;font-size:.82rem}
.oldbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin-top:14px;font-size:.85rem;color:var(--muted);padding-left:4px}
.coord{position:absolute;right:10px;bottom:46px;z-index:3;background:var(--bg);border-radius:10px;padding:4px 9px;font:500 .74rem var(--font-mono);color:var(--ink);box-shadow:var(--raise-sm)}
@media (max-width:520px){.card{padding:18px;border-radius:20px}.app{gap:22px}}
@media (max-width:560px){table{min-width:0}th:nth-child(2),td:nth-child(2),th:nth-child(5),td:nth-child(5){display:none}td .d-m{display:block}th,td{padding-left:10px;padding-right:10px}th.r,td.r{white-space:nowrap}tbody tr td:nth-child(4){border-radius:0 12px 12px 0}tbody tr.sel td:nth-child(4){box-shadow:-2px 0 0 0 var(--accent) inset,0 2px 0 0 var(--accent) inset,0 -2px 0 0 var(--accent) inset}}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="mark" aria-hidden="true"><span></span></span>
    <div class="tt">
      <h1 data-i="title">Tiger kahan ho sakta hai?</h1>
      <p class="sub" data-i="sub"></p>
    </div>
    <div class="seg lang" role="group" aria-label="Language / भाषा">
      <button type="button" data-lang="hi" aria-pressed="true" lang="hi">हिंदी</button>
      <button type="button" data-lang="en" aria-pressed="false" lang="en">English</button>
    </div>
  </header>

  <section class="card">
    <h2><span class="step">1</span><span data-i="s1"></span></h2>
    <form id="qForm" novalidate>
      <div class="row">
        <div class="f"><label for="qLat" data-i="lat"></label><input type="text" class="mono" inputmode="decimal" id="qLat" placeholder="20.8200"><span class="err" id="eLat"></span></div>
        <div class="f"><label for="qLng" data-i="lng"></label><input type="text" class="mono" inputmode="decimal" id="qLng" placeholder="80.7550"><span class="err" id="eLng"></span></div>
      </div>
      <div class="when">
        <span class="lbl" id="whenLbl" data-i="when"></span>
        <div class="chips" role="group" aria-labelledby="whenLbl">
          <button type="button" class="chip" data-h="0" aria-pressed="true" data-i="c0"></button>
          <button type="button" class="chip" data-h="6" aria-pressed="false" data-i="c6"></button>
          <button type="button" class="chip" data-h="24" aria-pressed="false" data-i="c24"></button>
          <button type="button" class="chip" data-h="48" aria-pressed="false" data-i="c48"></button>
          <button type="button" class="chip" data-h="custom" aria-pressed="false" data-i="cc"></button>
        </div>
        <input type="datetime-local" id="customWhen" hidden data-ia="cc">
        <span class="err" id="eWhen"></span>
      </div>
      <button type="submit" class="go" data-i="go"></button>
      <p class="tip" data-i="tip"></p>
    </form>
    <div class="samplenote" id="sampleNote" data-i="sample"></div>
    <div class="oldbar"><span data-i="oldTxt"></span><button type="button" class="btn danger sm" id="clearOld" data-i="clearOld"></button></div>
  </section>

  <section class="card result" aria-live="polite">
    <span class="eyebrow" data-i="resEye"></span>
    <div class="dial"><div><span class="n" id="dialN">–</span><span class="u" data-i="kmIn"></span></div></div>
    <div class="headline" id="headline">–</div>
    <p id="subline"></p>
  </section>

  <section class="card">
    <h2><span class="step">2</span><span data-i="s2"></span></h2>
    <p class="note" style="margin-top:6px" data-i="s2note"></p>
    <div class="tablewrap">
      <table>
        <thead><tr><th data-i="th1"></th><th data-i="th2"></th><th class="r" data-i="th3"></th><th class="r" data-i="th4"></th><th></th></tr></thead>
        <tbody id="tbl"></tbody>
      </table>
    </div>
  </section>

  <section class="card mapcard">
    <h2 style="padding:4px 6px 12px"><span class="step">3</span><span data-i="s3"></span></h2>
    <div class="mapwrap" id="mapwrap">
            <canvas id="map" data-ia="s3"></canvas>
      <canvas id="fly" hidden aria-hidden="true"></canvas>
      <button type="button" id="skipFly" hidden data-i="skip"></button>
      <div class="mtop">
        <div class="seg" role="group" data-ia="mapType">
          <button type="button" data-layer="sat" aria-pressed="true" data-i="lSat"></button>
          <button type="button" data-layer="street" aria-pressed="false" data-i="lMap"></button>
        </div>
        <div class="zoom">
          <button type="button" id="zin" data-ia="zin">+</button>
          <button type="button" id="zout" data-ia="zout">−</button>
          <button type="button" id="zfit" data-ia="zfit">◎</button>
        </div>
      </div>
      <div class="maptag" id="maptag"></div>
      <div class="legend" aria-hidden="true">
        <span class="sw" style="background:var(--inner)"></span><span data-i="th3"></span>
        <span class="sw" style="background:var(--outer)"></span><span data-i="th4"></span>
      </div>
      <div class="info" id="info" hidden></div>
      <div class="attr" id="attr"></div>
      <div class="coord" id="coord" aria-live="off"></div>
      <div class="mapnote" id="mapnote" hidden><span id="mapnoteText"></span><button type="button" id="mapnoteX" data-ia="close">×</button></div>
    </div>
    <div class="mapbar">
      <a class="btn hl" id="earthLink" href="#" target="_blank" rel="noopener" data-i="earth"></a>
      <button type="button" class="btn" id="labelsBtn" aria-pressed="true"></button>
      <button type="button" class="btn" id="replay" data-i="replay"></button>
      <button type="button" class="btn" id="soundBtn" aria-pressed="true"></button>
    </div>
    <div class="credit">
      <span data-i="credit"></span>
      <span class="mail"><span data-i="contact"></span> <b id="mailTxt">hexorhexor66@gmail.com</b></span>
      <button type="button" class="btn sm" id="copyMail" data-i="copy"></button>
    </div>
  </section>

  <details class="card" id="histBox">
    <summary><span data-i="hist"></span> (<span id="histCount">0</span>)</summary>
    <ul class="hist" id="hist"></ul>
    <p class="note" data-i="histNote"></p>
    <div class="mapbar" style="padding:14px 0 0">
      <button type="button" class="btn danger" id="clearBtn" data-i="clear"></button>
      <button type="button" class="btn" id="dlBtn" data-i="dl"></button>
    </div>
  </details>

  <details class="card" id="setBox">
    <summary data-i="settings"></summary>
    <div class="row" style="margin-top:0">
      <div class="f"><label for="setAvg" data-i="avg"></label><input type="number" id="setAvg" min="0.5" step="0.5"></div>
      <div class="f"><label for="setMax" data-i="max"></label><input type="number" id="setMax" min="0.5" step="0.5"></div>
    </div>
    <p class="note" data-i="speedNote"></p>
  </details>

  <p class="foot"><span data-i="foot"></span><br><span data-i="credit"></span> · hexorhexor66@gmail.com</p>
</div>

<script id="seed" type="application/json">null</script>
<script id="app-js">
(function(){
"use strict";
var HR=3600e3, KEY="tigerZoneSimple.v1", FLOOR=0.5, CAP=60;

["setAvg","setMax"].forEach(function(id){$(id).addEventListener("change",function(){var v=parseFloat(this.value);if(isNaN(v)||v<=0){render();return;}state.set[id==="setAvg"?"avg":"max"]=v;if(state.set.max<state.set.avg)state.set.max=state.set.avg;save();render();});});

  try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));a.download="tiger-zone-tracker.html";document.body.appendChild(a);a.click();a.remove();}catch(err){toast(t("dlFail"));}
};
